[package]
name = "dss-codec"
version = "0.1.0"
edition = "2021"
description = "Native DSS/DS2 audio decoder (Olympus Digital Speech Standard)"
license = "MIT"

[[bin]]
name = "dss-decode"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
hound = "3"
rubato = "0.16"
sha1 = "0.10"
sha2 = "0.10"

[dev-dependencies]
approx = "0.5"

# This crate is a copy of the codec fork (see ../README.md) and its output is
# pinned bit for bit by tests. These lints ask for rewrites of the DSP and
# demux code itself (index loops that mirror the reference decoder, slice
# copies, enum layout, signatures); such rewrites belong upstream, where they
# can be checked against the reference, not in a vendored copy. Every other
# clippy lint is enforced with -D warnings in CI.
[lints.clippy]
needless_range_loop = "allow"
manual_memcpy = "allow"
chunks_exact_to_as_chunks = "allow"
collapsible_match = "allow"
large_enum_variant = "allow"
manual_is_multiple_of = "allow"
ptr_arg = "allow"
empty_line_after_doc_comments = "allow"
